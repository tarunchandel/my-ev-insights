name: Deploy to Google Play (Internal & Closed Testing)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Override Version Code (optional)'
        required: false
        type: string
      version_name:
        description: 'Override Version Name (optional)'
        required: false
        type: string

concurrency:
  group: play-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Keystore & Play Service Account Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "Error: PLAY_SERVICE_ACCOUNT_JSON secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.jks
          echo "$SERVICE_ACCOUNT_JSON" > android/app/service-account.json
          
          if [ ! -s android/app/my-release-key.jks ]; then
            echo "Error: Decoded my-release-key.jks is empty or missing."
            exit 1
          fi
          if [ ! -s android/app/service-account.json ]; then
            echo "Error: service-account.json is empty or missing."
            exit 1
          fi
          echo "Keystore and Service Account JSON successfully restored."

      - name: Determine Versioning
        id: versioning
        run: |
          # Read base version from package.json
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          # Calculate unique auto-incrementing versionCode from GitHub run number (base offset 10)
          CALCULATED_CODE=$(( 10 + ${{ github.run_number }} ))
          
          # Use input overrides if manually dispatched, otherwise computed values
          FINAL_CODE="${{ inputs.version_code }}"
          FINAL_NAME="${{ inputs.version_name }}"
          
          if [ -z "$FINAL_CODE" ]; then
            FINAL_CODE="$CALCULATED_CODE"
          fi
          if [ -z "$FINAL_NAME" ]; then
            FINAL_NAME="$PKG_VERSION"
          fi
          
          echo "version_code=$FINAL_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          echo "Building Version Name: $FINAL_NAME with Version Code: $FINAL_CODE"

      - name: Publish Release Bundle to Internal Testing Track
        working-directory: android
        env:
          RELEASE_STORE_FILE: my-release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew publishReleaseBundle \
            -PversionCode=${{ steps.versioning.outputs.version_code }} \
            -PversionName=${{ steps.versioning.outputs.version_name }} \
            -Ptrack=internal \
            -PRELEASE_STORE_FILE=my-release-key.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --stacktrace > build_output.log 2>&1
          STATUS=$?
          cat build_output.log
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Gradle Build Error::$(tail -n 25 build_output.log)"
            exit $STATUS
          fi

      - name: Promote Release Artifact to Closed Testing (Alpha) Track
        working-directory: android
        run: |
          set +e
          ./gradlew promoteReleaseArtifact \
            --from-track=internal \
            --promote-track=alpha \
            --stacktrace > promote_output.log 2>&1
          STATUS=$?
          cat promote_output.log
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Promote Error::$(tail -n 25 promote_output.log)"
            exit $STATUS
          fi
